name: Validation

# Validation only, through alexcatdad/ci-actions (pinned to a reviewed commit).
# Nothing here tags, publishes or releases. Commands are the repository's own
# Task targets; scripts/ci_setup.sh selects Xcode and installs Task on the
# runner. The weekly schedule reruns the main contract and CodeQL.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions: {}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-pr.yml@76e8ddb7079aa16605a84138f9357143adcc878d
    with:
      runner: macos-26
      lint-command: ./scripts/ci_setup.sh && task lint
      build-command: ./scripts/ci_setup.sh && task build
      test-command: ./scripts/ci_setup.sh && task test
      # Prose no lint, build or test command reads; a PR touching only these skips lint, build and test.
      inert-paths: |
        README.md
        CHANGELOG.md
        CONTRIBUTING.md
        SECURITY.md
        CODE_OF_CONDUCT.md
        AGENTS.md
        LICENSE

  main:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-main.yml@76e8ddb7079aa16605a84138f9357143adcc878d
    with:
      runner: macos-26
      test-command: ./scripts/ci_setup.sh && task test
      security-command: ./scripts/ci_setup.sh && task security

  codeql:
    # The one allowed write scope: uploading code scanning results.
    permissions:
      contents: read
      security-events: write
    uses: alexcatdad/ci-actions/.github/workflows/codeql.yml@76e8ddb7079aa16605a84138f9357143adcc878d
    with:
      languages: '["swift", "actions"]'
      swift-build-command: swift build
