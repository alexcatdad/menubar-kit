name: Validation

# Validation only, through alexcatdad/ci-actions (pinned to a reviewed commit).
# Nothing here tags, publishes or releases. Commands are the repository's own
# Task targets; scripts/ci_setup.sh selects Xcode and installs Task on the
# runner. The weekly schedule reruns the main contract and CodeQL.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions: {}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-pr.yml@515066dac791f5a1222cfc99be038c220980ce23
    with:
      runner: macos-26
      lint-command: ./scripts/ci_setup.sh && task lint
      build-command: ./scripts/ci_setup.sh && task build
      test-command: ./scripts/ci_setup.sh && task test

  main:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-main.yml@515066dac791f5a1222cfc99be038c220980ce23
    with:
      runner: macos-26
      test-command: ./scripts/ci_setup.sh && task test
      security-command: ./scripts/ci_setup.sh && task security

  codeql:
    # The one allowed write scope: uploading code scanning results.
    permissions:
      contents: read
      security-events: write
    uses: alexcatdad/ci-actions/.github/workflows/codeql.yml@515066dac791f5a1222cfc99be038c220980ce23
    with:
      languages: '["swift", "actions"]'
      swift-build-command: swift build
